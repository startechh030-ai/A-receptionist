# Render Blueprint. Deploy: New + Blueprint (point at this repo).
services:
  - type: web
    name: ai-receptionist
    runtime: docker
    # Now LIGHTWEIGHT: Groq handles LLM/STT/TTS, so no heavy local model.
    # Starter (or even Free) is enough. No 1GB+ requirement anymore.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: HOTEL_NAME
        value: City Resort Hotel
      - key: RECEPTIONIST_NAME
        value: Daven
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_TTS_MODEL
        value: canopylabs/orpheus-v1-english   # accept terms in Groq console to enable
      - key: GROQ_TTS_VOICE
        value: troy
      - key: GROQ_API_KEY
        sync: false          # <-- set this SECRET in the Render dashboard (do NOT commit it)
      - key: PYTHON_VERSION
        value: "3.11.9"
